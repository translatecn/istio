apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
spec:
  hub: ccr.ccs.tencentyun.com/acejilam
  components:
    cni:
      enabled: true
      namespace: kube-system
    ztunnel:
      enabled: true
      namespace: kube-system
    ingressGateways:
      - name: istio-ingressgateway
        enabled: false
  values:
    profile: ambient
    global:
      platform: openshift


