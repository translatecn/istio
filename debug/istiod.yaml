apiVersion: apps/v1
kind: Deployment
metadata:
  name: istiod-dev
  namespace: istio-system
  labels:
    app: istiod
    app.kubernetes.io/instance: istio
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: istiod
    app.kubernetes.io/part-of: istio
    app.kubernetes.io/version: 1.24.3
    install.operator.istio.io/owning-resource: unknown
    install.operator.istio.io/owning-resource-namespace: istio-system
    istio.io/rev: default
    operator.istio.io/component: Pilot
    operator.istio.io/managed: Reconcile
    operator.istio.io/version: 1.24.3
    release: istio
  annotations:
    deployment.kubernetes.io/revision: '1'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: istiod
  template:
    metadata:
      labels:
        app: istiod
        istio: pilot
        app.kubernetes.io/instance: istio
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: istiod
        app.kubernetes.io/part-of: istio
        app.kubernetes.io/version: 1.24.3
        install.operator.istio.io/owning-resource: unknown
        istio.io/dataplane-mode: none
        istio.io/rev: default
        operator.istio.io/component: Pilot
        sidecar.istio.io/inject: 'false'
      annotations:
        prometheus.io/port: '15014'
        prometheus.io/scrape: 'true'
        sidecar.istio.io/inject: 'false'
    spec:
      volumes:
        - name: local-certs
          emptyDir:
            medium: Memory
        - name: istio-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: istio-ca
                  expirationSeconds: 43200
                  path: istio-token
            defaultMode: 420
        - name: cacerts
          secret:
            secretName: cacerts
            defaultMode: 420
            optional: true
        - name: istio-kubeconfig
          secret:
            secretName: istio-kubeconfig
            defaultMode: 420
            optional: true
        - name: istio-csr-dns-cert
          secret:
            secretName: istiod-tls
            defaultMode: 420
            optional: true
        - name: istio-csr-ca-configmap
          configMap:
            name: istio-ca-root-cert
            defaultMode: 420
            optional: true
      containers:
        - name: discovery
          image: registry.cn-hangzhou.aliyuncs.com/acejilam/pilot:1.24.3
          args:
            - discovery
            - '--monitoringAddr=:15014'
            - '--log_output_level=default:info'
            - '--domain'
            - cluster.local
            - '--keepaliveMaxServerConnectionAge'
            - 30m
          ports:
            - name: http-debug
              containerPort: 8080
              protocol: TCP
            - name: grpc-xds
              containerPort: 15010
              protocol: TCP
            - name: tls-xds
              containerPort: 15012
              protocol: TCP
            - name: https-webhooks
              containerPort: 15017
              protocol: TCP
            - name: http-monitoring
              containerPort: 15014
              protocol: TCP
          env:
            - name: REVISION
              value: default
            - name: PILOT_CERT_PROVIDER
              value: istiod
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
            - name: SERVICE_ACCOUNT
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: spec.serviceAccountName
            - name: KUBECONFIG
              value: /var/run/secrets/remote/config
            - name: CA_TRUSTED_NODE_ACCOUNTS
              value: istio-system/ztunnel
            - name: PILOT_TRACE_SAMPLING
              value: '100'
            - name: PILOT_ENABLE_ANALYSIS
              value: 'false'
            - name: CLUSTER_ID
              value: Kubernetes
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
                  divisor: '0'
            - name: GOMAXPROCS
              valueFrom:
                resourceFieldRef:
                  resource: limits.cpu
                  divisor: '1'
            - name: PLATFORM
#          resources:
#            requests:
#              cpu: 10m
#              memory: 100Mi
          volumeMounts:
            - name: istio-token
              readOnly: true
              mountPath: /var/run/secrets/tokens
            - name: local-certs
              mountPath: /var/run/secrets/istio-dns
            - name: cacerts
              readOnly: true
              mountPath: /etc/cacerts
            - name: istio-kubeconfig
              readOnly: true
              mountPath: /var/run/secrets/remote
            - name: istio-csr-dns-cert
              readOnly: true
              mountPath: /var/run/secrets/istiod/tls
            - name: istio-csr-ca-configmap
              readOnly: true
              mountPath: /var/run/secrets/istiod/ca
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 1
            timeoutSeconds: 5
            periodSeconds: 3
            successThreshold: 1
            failureThreshold: 3
          securityContext:
            capabilities:
              drop:
                - ALL
      serviceAccountName: istiod
      tolerations:
        - key: cni.istio.io/not-ready
          operator: Exists
