# This file provides some defaults for integration testing.
apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
metadata:
  name: install
spec:
  hub: registry.cn-hangzhou.aliyuncs.com/acejilam
  profile: remote
  meshConfig:
    accessLogFile: "/dev/stdout"
    defaultConfig:
      proxyMetadata:
        ISTIO_META_DNS_CAPTURE: "true"
  components:
    egressGateways:
      - name: istio-egressgateway
        enabled: false
  values:
    global:
      externalIstiod: true

