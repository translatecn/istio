apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
spec:
  hub: registry.cn-hangzhou.aliyuncs.com/acejilam
  components:
    base:
      enabled: true
    pilot:
      enabled: true
    cni:
      enabled: false
    ingressGateways:
      - namespace: istio-system
        name: istio-ingressgateway
        enabled: true
    egressGateways:
      - namespace: istio-system
        name: istio-egressgateway
        enabled: true

