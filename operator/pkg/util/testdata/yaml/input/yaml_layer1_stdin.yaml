apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
spec:
  hub: registry.cn-hangzhou.aliyuncs.com/acejilam
  components:
    pilot:
      enabled: false
    ingressGateways:
      - namespace: istio-system
        name: istio-ingressgateway
        enabled: true
        k8s:
          service:
            externalTrafficPolicy: Local
          serviceAnnotations:
            manifest-generate: "testserviceAnnotation"

